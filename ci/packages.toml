custom = "gnuplot"

# kitty: GPU terminal, source build adapted from LionHeartP/hyprlandRPM's
# spec (online Go modules for kitten, in-repo appdata, pinned nerd font,
# sphinx man pages). Subpackages: terminfo, shell-integration, kitten.
[cava]
batch = 0

[cava.updates]
feed = "github-release"
repo = "karlstav/cava"

# pixi: official musl binary + completions generated at build time. (A
# source-build attempt was reverted — it hung in CI and costs 1-2h on
# runners; Terra builds it from source with %cargo_prep_online.)
[pixi]
batch = 0

[pixi.updates]
feed = "github-release"
repo = "prefix-dev/pixi"

# zotero follows terrapkg's spec (install layout, desktop file, icons,
# appstream) over the OFFICIAL prebuilt tarball — the npm source build is
# unbuildable today (its CI artifact S3 bucket 403s for current tags, see
# the zotero.spec header). Version sweeps the zotero/zotero git tag but only
# lands on tags whose linux tarball is actually published on
# download.zotero.org — the 10.0.4 tag's tarball 403s upstream and killed the
# 2026-09-27 batch-0 submit (custom_zotero in ci/sweep/custom.py).
[xwiimote-ng]
batch = 0

# zoxide / fd-find / cliphist: rust source builds (cliphist builds from the
# tag tarball — it does not publish to crates.io). zoxide and fd-find shadow
# older Fedora versions; cliphist matches Fedora's 0.7.0 and wins on priority.
[zoxide]
batch = 0

[zoxide.updates]
feed = "github-release"
repo = "ajeetdsouza/zoxide"

# asdf: version manager, Go source build in the house nwg-look pattern
# (plain go build, modules from the Go proxy at build time) instead of
# Terra's go2rpm machinery.
[asdf]
batch = 0

[asdf.updates]
feed = "github-release"
repo = "asdf-vm/asdf"

[fd-find]
batch = 0

[fd-find.updates]
feed = "github-release"
repo = "sharkdp/fd"

[cliphist]
batch = 0

[cliphist.updates]
feed = "github-release"
repo = "sentriz/cliphist"

# topgrade: rust source build ported from li-lay/topgrade-watcher (their Copr
# spec sweeps the same topgrade-rs/topgrade releases). Not in Fedora. The
# github-release feed returns the raw v-tag; set_version strips it for both
# the Version line and the crates.io Source URL.
[topgrade]
batch = 0

[topgrade.updates]
feed = "github-release"
repo = "topgrade-rs/topgrade"

[xwiimote-ng.updates]
feed = "github-tag"
repo = "dev-0x7C6/xwiimote-ng"

# ticktick follows the AUR PKGBUILD (vendor .deb payload, launcher, SUID
# sandbox). TickTick publishes no first-party version feed, so the version
# sweeps the AUR package via the AUR RPC API — the AUR maintainer tracks
# upstream releases.
[fzf]
batch = 0

[fzf.updates]
feed = "github-release"
repo = "junegunn/fzf"

# fzy: small C fuzzy finder, plain source build (Fedora ships it in
