# ci/packages.toml — the cli-tools build registry + sweep-feed config.
#
# Consumed by ci/matrix.py (build selection) and ci/sweep/sweep.py (version
# sweep). One table per package; **a package without an entry is not built**.
# The specs themselves live in pkgs/<pkg>/<pkg>.spec.
#
# Batches are dependency levels, not parallel groups within one job:
# copr-build.yml submits the waves sequentially and waits for each wave's
# Copr builds before the next — each successful build is immediately visible
# to the project repo, so a package may rely on anything built in a lower
# batch. Packages inside one batch must therefore never depend on each other.
#
# All packages are batch 0: leaf CLI tools with no inter-dependencies
# (one submit wave).
# The optional [pkg.updates] table drives the daily sweep (update.yml):
#   feed = "github-release"  + repo = "owner/name"   latest GitHub release tag
#   feed = "github-tag"      + repo = "owner/name"   newest git tag
#   feed = "custom"          + custom = "<name>"     ci/sweep/custom.py function

# --------------------------------------------------------------- desktops

# --- batch 0 ------------------------------------------------------------
[bun]
batch = 0

[bun.updates]
feed = "custom"
custom = "bun"

# tealdeer: Rust source build (crates.io) + completions generated at build time.
[tealdeer]
batch = 0

[tealdeer.updates]
feed = "github-release"
repo = "dbrgn/tealdeer"

# uv: official musl tarball (uv + uvx), completions generated at build time.
[uv]
batch = 0

[uv.updates]
feed = "github-release"
repo = "astral-sh/uv"

# atuin: Rust source build (crates.io).
[atuin]
batch = 0

[atuin.updates]
feed = "github-release"
repo = "atuinsh/atuin"

# bat: Rust source build (crates.io); binary only.
[bat]
batch = 0

[bat.updates]
feed = "github-release"
repo = "sharkdp/bat"

# bat-extras: bat companion scripts (batdiff/batgrep/batman/batpipe/
# batwatch/prettybat), noarch build.sh-driven; ported from Terra.
[bat-extras]
batch = 0

[bat-extras.updates]
feed = "github-release"
repo = "eth-p/bat-extras"

